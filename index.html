<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Weather PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .weather-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.15);
        }
        h1 { font-size: 1.6rem; margin: 0 0 5px 0; font-weight: 500; }
        .temp { font-size: 3.5rem; font-weight: bold; margin: 15px 0; }
        .desc { font-size: 1.2rem; text-transform: capitalize; opacity: 0.9; margin-bottom: 20px; }
        .meta { display: flex; justify-content: space-around; font-size: 0.9rem; opacity: 0.7; }
        .btn-location {
            background: #ffffff; color: #1e3c72; border: none; padding: 10px 16px;
            border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="weather-card">
        <h1 id="location-name">Your Location</h1>
        <div id="temp" class="temp">--°C</div>
        <div id="desc" class="desc">Detecting conditions...</div>
        <div class="meta">
            <span id="wind">Wind: -- km/h</span>
            <span id="humidity">Humidity: --%</span>
        </div>
        <button class="btn-location" onclick="getUserLocation()">🔄 Update Location</button>
    </div>

    <script>
        // Register Service Worker for PWA compliance
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg.scope))
                    .catch(err => console.log('Service Worker Failed:', err));
            });
        }

        function getUserLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(fetchWeather, () => {
                    // Fallback to default coordinates (Hong Kong) if browser GPS is blocked
                    fetchWeather({ coords: { latitude: 22.3193, longitude: 114.1694 } });
                });
            }
        }

        async function fetchWeather(position) {
            /* const lat = 22.319859; */            
            /* const lon = 114.198555; */
            const lat = position.coords.latitude;            
            const lon = position.coords.longitude;
            try {
                // Free public weather API - No API key registration required
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m`;
                const response = await fetch(url);
                const data = await response.json();
                
                document.getElementById('location-name').innerText = `GPS Check active`;
                document.getElementById('temp').innerText = `${Math.round(data.current.temperature_2m)}°C`;
                document.getElementById('humidity').innerText = `Humidity: ${data.current.relative_humidity_2m}%`;
                document.getElementById('wind').innerText = `Wind: ${data.current.wind_speed_10m} km/h`;
                document.getElementById('desc').innerText = getWeatherDescription(data.current.weather_code);
            } catch (error) {
                document.getElementById('desc').innerText = "Offline or data error";
            }
        }

        function getWeatherDescription(code) {
            // WMO Weather interpretation codes mapping
            if (code === 0) return "Clear Sky";
            if (code <= 3) return "Partly Cloudy";
            if (code <= 48) return "Foggy";
            if (code <= 67) return "Drizzle / Light Rain";
            if (code <= 82) return "Rain Showers";
            return "Stormy";
        }

        getUserLocation();
    </script>
</body>
</html>
